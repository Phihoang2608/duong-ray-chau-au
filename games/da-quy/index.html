<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thương Nhân Đá Quý | Phi Board Games</title>
</head>
<body>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../../core/room.js"></script>
<script src="../../core/audio.js"></script>
<script src="../../core/effects.js"></script>
<script src="../../core/table.js"></script>
<script src="../../core/cards.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script>
const CSS=`#dq{padding:10px 12px 20px}
.dqwrap{display:grid;grid-template-columns:auto 118px minmax(250px,320px);gap:14px;justify-content:center;align-items:start}
.dqboard{display:flex;flex-direction:column;gap:9px}
.nobles{display:flex;gap:9px;justify-content:center;margin-bottom:2px}
.dqn{width:96px;height:96px;border-radius:12px;background:linear-gradient(150deg,#fff7e6,#f3d9a4);border:2px solid #c9a24e;box-shadow:0 4px 12px rgba(120,80,20,.25);position:relative;padding:5px;display:flex;flex-direction:column}
.dqn>b{font-size:24px;color:#7a4a00;line-height:1}.dqn .req{position:absolute;left:5px;bottom:20px;display:flex;flex-direction:column;gap:2px}
.dqn .nn{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10.5px;color:#7a4a00;line-height:1.05;padding:0 3px}
.rq,.cc{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:var(--g);border:1.5px solid var(--d);font-weight:bold;font-size:13px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.cc{border-radius:50%;width:22px;height:22px}
.row{display:flex;gap:9px}
.deck{width:104px;height:140px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;cursor:pointer;border:3px solid #fff;box-shadow:0 5px 14px rgba(0,0,0,.25);text-align:center;transition:transform .15s}
.deck:hover{transform:translateY(-3px)}.deck span{font-size:13px;letter-spacing:.04em}.deck b{font-size:26px}.deck em{font-style:normal;letter-spacing:4px;color:#fde68a}
.deck.lv1{background:linear-gradient(150deg,#2f9e77,#155a44)}.deck.lv2{background:linear-gradient(150deg,#d9a520,#8a5a00)}.deck.lv3{background:linear-gradient(150deg,#4a5fd0,#1e2a78)}
.dqc{width:104px;height:140px;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.25);border:3px solid #fff;transition:transform .15s,box-shadow .2s;flex:none}
.dqc:hover{transform:translateY(-4px)}.dqc.empty{background:rgba(0,0,0,.05);border:2px dashed #ccc;box-shadow:none;cursor:default}
.dqc .art{position:absolute;inset:0;background-size:100% auto;background-repeat:no-repeat;background-position:bottom}
.dqc.lv1 .art{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%2080%22%3E%3Cpath%20d%3D%22M0%2080%20L0%2052%20L18%2030%20L30%2044%20L46%2020%20L64%2046%20L78%2032%20L100%2054%20L100%2080Z%22%20fill%3D%22white%22%20opacity%3D%22.28%22/%3E%3Cpath%20d%3D%22M40%2080%20L40%2064%20Q50%2052%2060%2064%20L60%2080Z%22%20fill%3D%22black%22%20opacity%3D%22.25%22/%3E%3Cpath%20d%3D%22M0%2080%20L0%2066%20L30%2060%20L60%2068%20L100%2062%20L100%2080Z%22%20fill%3D%22white%22%20opacity%3D%22.18%22/%3E%3C/svg%3E")}.dqc.lv2 .art{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%2080%22%3E%3Crect%20x%3D%2214%22%20y%3D%2236%22%20width%3D%2272%22%20height%3D%2244%22%20fill%3D%22white%22%20opacity%3D%22.25%22/%3E%3Cpath%20d%3D%22M10%2038%20L50%2014%20L90%2038Z%22%20fill%3D%22white%22%20opacity%3D%22.32%22/%3E%3Cpath%20d%3D%22M26%2080%20L26%2058%20Q34%2048%2042%2058%20L42%2080Z%20M58%2080%20L58%2058%20Q66%2048%2074%2058%20L74%2080Z%22%20fill%3D%22black%22%20opacity%3D%22.22%22/%3E%3Crect%20x%3D%2270%22%20y%3D%2216%22%20width%3D%228%22%20height%3D%2216%22%20fill%3D%22white%22%20opacity%3D%22.3%22/%3E%3C/svg%3E")}.dqc.lv3 .art{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%2080%22%3E%3Cpath%20d%3D%22M8%2080%20L8%2034%20L16%2034%20L16%2028%20L22%2028%20L22%2034%20L30%2034%20L30%2046%20L42%2046%20L42%2022%20L48%2022%20L48%2014%20L52%208%20L56%2014%20L56%2022%20L62%2022%20L62%2046%20L72%2046%20L72%2034%20L78%2034%20L78%2028%20L84%2028%20L84%2034%20L92%2034%20L92%2080Z%22%20fill%3D%22white%22%20opacity%3D%22.3%22/%3E%3Cpath%20d%3D%22M44%2080%20L44%2062%20Q50%2052%2056%2062%20L56%2080Z%22%20fill%3D%22black%22%20opacity%3D%22.25%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2212%22%20r%3D%225%22%20fill%3D%22white%22%20opacity%3D%22.35%22/%3E%3C/svg%3E")}
.dqc.col0{background:linear-gradient(160deg,#4ade80,#15803d)}.dqc.col1{background:linear-gradient(160deg,#60a5fa,#1d4ed8)}.dqc.col2{background:linear-gradient(160deg,#f87171,#b91c1c)}.dqc.col3{background:linear-gradient(160deg,#f8fafc,#a8b3c4)}.dqc.col4{background:linear-gradient(160deg,#52525b,#18181b)}
.dqc .hd{position:relative;display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:rgba(255,255,255,.75)}
.dqc .hd b{font-size:24px;color:#1d1b2e;line-height:1}.dqc .costs{position:absolute;left:5px;bottom:5px;display:flex;flex-direction:column;gap:3px}
.dqc.can{box-shadow:0 0 0 3px #22c55e,0 6px 16px rgba(34,197,94,.45)}
.dqc.pk,.deck.pk{transform:translateY(-6px) scale(1.04);box-shadow:0 0 0 4px #8a5cf6,0 10px 26px rgba(138,92,246,.5)}
.dqc.flip{animation:dqf .55s both}@keyframes dqf{from{transform:rotateY(90deg) scale(.8)}}
.bank{display:flex;flex-direction:column;align-items:center;gap:7px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;padding:10px 8px}
.bank .bt{font-weight:bold;font-size:15px}.bank small{font-size:11.5px;color:#777;text-align:center;line-height:1.2}
.tok{position:relative;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff,#e9e4f5);border:3px solid #d9d2ee;cursor:pointer;transition:transform .15s,box-shadow .2s}
.tok:hover{transform:scale(1.07)}.tok.on{border-color:#8a5cf6;box-shadow:0 0 0 3px rgba(138,92,246,.35),0 6px 16px rgba(138,92,246,.35);transform:translateY(-3px)}
.tok span{position:absolute;right:-6px;bottom:-4px;background:#1d1b2e;color:#fff;border-radius:10px;font-size:12px;padding:0 6px;font-weight:bold}
.tok i{position:absolute;left:-8px;top:-6px;background:#8a5cf6;color:#fff;border-radius:9px;font-size:11px;padding:0 5px;font-style:normal}
.tok.gold{cursor:default;background:radial-gradient(circle at 35% 30%,#fff8e1,#fde68a)}
.players{display:flex;flex-direction:column;gap:8px}
.pl{background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:14px;padding:7px 9px}
.pl.turn{border-color:#f59e0b;box-shadow:0 0 14px rgba(245,158,11,.4)}.pl.me{background:#faf7ff}.pl.win{border-color:#22c55e;background:#f0fdf4}
.pl .ph{display:flex;align-items:center;gap:6px;font-size:15px}.pl .pts{margin-left:auto;font-size:22px;font-weight:bold;color:#b5332f;min-width:30px;text-align:right}
.pl .gr{display:flex;gap:4px;margin-top:5px}.pl .gc{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.bn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:32px;border-radius:5px;background:var(--g);border:1.5px solid var(--d);font-weight:bold;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;font-size:14px}.bn.ph0{visibility:hidden}
.pl .tk{display:flex;align-items:center;gap:1px;font-size:13px;font-weight:bold}.pl .tk[data-ret]{cursor:pointer;background:#fee2e2;border-radius:8px;padding:0 3px;animation:tp 1s infinite}@keyframes tp{50%{transform:translateY(-3px)}}
.pl .ft{font-size:12px;color:#666;margin-top:4px}
.tmr{background:#f59e0b;color:#fff;border-radius:10px;padding:0 6px;font-weight:bold;font-size:12px}
.mine{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px auto 0;max-width:1180px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:16px;padding:9px 12px}
.mine .rs{display:flex;gap:8px;align-items:center}.mine .rs .lb{font-size:13px;color:#666;writing-mode:vertical-rl;transform:rotate(180deg)}.mine .rs em{color:#999;font-size:13px}
.mine .rs .dqc{width:80px;height:108px}.mine .rs .dqc .hd b{font-size:19px}.mine .rs .cc{width:18px;height:18px;font-size:11px}
.mine .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;min-width:260px;justify-content:center}.mine .warn{color:#b91c1c}
.rq[data-w],.cc[data-w],.bn[data-w]{color:#1d1b2e;text-shadow:none}
.tbtn.gold{border:none;color:#3d2a00;background:linear-gradient(135deg,#fde047,#f59e0b);font-weight:bold}
.xlog{width:min(1100px,94vw);margin:10px auto 0;font-size:13.5px;color:#555268}.xlog div{border-bottom:1px dotted #e6e1f5;padding:2px 0}
@media (max-width:1100px){ .dqwrap{grid-template-columns:auto 100px} .players{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.pl{flex:1;min-width:230px} }
@media (max-height:520px){ #dq{padding:4px} .dqwrap{grid-template-columns:auto 78px minmax(200px,250px);gap:8px} .players{grid-column:auto;flex-direction:column}.pl{min-width:0;padding:4px 6px}
  .dqc,.deck{width:62px;height:84px;border-width:2px;border-radius:8px} .dqc .hd{padding:2px 3px}.dqc .hd b{font-size:15px}.dqc .gem{width:16px;height:16px} .cc{width:15px;height:15px;font-size:10px} .dqc .costs{gap:1px;left:3px;bottom:3px}
  .deck span{font-size:9px}.deck b{font-size:16px}.deck em{display:none} .row,.dqboard{gap:5px} .dqn{width:58px;height:58px;padding:3px}.dqn>b{font-size:15px}.dqn .nn{display:none}.dqn .req{bottom:3px}.rq{width:14px;height:14px;font-size:10px}
  .tok{width:40px;height:40px}.tok .gem{width:22px;height:22px}.bank{padding:5px;gap:4px}.bank small{display:none}.bank .bt{font-size:12px}
  .pl .ph{font-size:13px}.pl .pts{font-size:17px}.bn{width:20px;height:22px;font-size:12px}.pl .tk{font-size:11px}.pl .tk .gem{width:12px;height:12px}.pl .ft{display:none}
  .mine{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border-radius:14px 14px 0 0;padding:4px 8px;gap:8px} #dq{padding-bottom:70px} .mine .rs .lb{display:none} .mine .act{min-width:0;font-size:13px}.mine .rs .dqc{width:54px;height:72px} .xlog{display:none} }
`;
Table.init({ id:'da-quy', prefix:'dq', title:'Thương Nhân Đá Quý', tagline:'Gom đá quý, mua mỏ và thương điếm, mời quý tộc ghé thăm',
  minPlayers:2, maxPlayers:4, botOptions:[1,2,3], defaultBots:1, turnLimit:60, botDelay:600, css:CSS,
  newGame:DQ.newGame, apply:DQ.apply, tick:DQ.tick, whoActs:DQ.whoActs, botAction:DQ.botAction, timeoutAction:DQ.timeoutAction,
  render:DQUI.render, tickView:DQUI.tickView,
  rules:`<p><b>Mục tiêu:</b> là người đầu tiên đạt <b>${DQ_WIN} điểm uy tín</b>. Khi có người đạt, mọi người chơi nốt vòng đó rồi so điểm (bằng điểm thì ai mua ít thẻ hơn thắng).</p>
  <p><b>Mỗi lượt chọn 1 việc:</b></p>
  <p>• <b>Lấy 3 viên đá khác màu</b>, hoặc <b>2 viên cùng màu</b> (chỉ khi ngân khố còn từ 4 viên màu đó).</p>
  <p>• <b>Giữ chỗ</b> 1 thẻ (trên bàn hoặc úp từ chồng bài) và nhận 1 viên <b>Vàng</b> — vàng thay được mọi màu. Giữ tối đa 3 thẻ.</p>
  <p>• <b>Mua</b> 1 thẻ trên bàn hoặc thẻ đang giữ: trả số đá ghi ở góc dưới. Mỗi thẻ đã mua cho bạn <b>giảm giá vĩnh viễn 1 viên</b> màu của thẻ đó. Thẻ có viền xanh là thẻ bạn mua được ngay.</p>
  <p><b>Quý tộc:</b> khi số thẻ bạn sở hữu đủ yêu cầu của một quý tộc, quý tộc tự ghé thăm, cộng 3 điểm.</p>
  <p>Giữ tối đa 10 viên đá; thừa phải trả lại. Mỗi lượt có 60 giây.</p>` });
</script>
</body>
</html>
