<script>
const CSS=`.bank .tok .gn{display:none!important}
.dqgain{position:fixed;z-index:9998;display:flex;flex-direction:column;gap:5px;pointer-events:none;font-family:"Times New Roman",serif}
.dqgain .gi{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;background:linear-gradient(160deg,rgba(40,26,12,.95),rgba(20,12,4,.95));border:1.5px solid #e9c46a;box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 12px rgba(233,196,106,.35);color:#fff3cf;font-size:16px;white-space:nowrap}
.dqgain .gi svg{width:24px;height:24px}.dqgain .gi.cd{padding-left:12px;color:#ffe08a}.dqgain .gi.pt{padding-left:12px;color:#7dffb0;font-size:18px}
.dqshow{position:fixed;z-index:9997;display:flex;align-items:center;gap:10px;pointer-events:none}
.dqshow .sc{width:min(190px,24vw);aspect-ratio:5/7;filter:drop-shadow(0 14px 28px rgba(0,0,0,.6)) drop-shadow(0 0 14px rgba(255,220,140,.5))}
.dqshow .sc svg{width:100%;height:100%;display:block}
.dqgain.in{position:static}
.bank .tok{border-radius:18px;border:3px solid var(--gc,#c9a24e);background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.16),rgba(0,0,0,.45) 75%);box-shadow:inset 0 0 0 2px rgba(255,233,168,.45),inset 0 0 14px rgba(0,0,0,.6),0 0 10px var(--gg,rgba(201,162,78,.35)),0 4px 8px rgba(0,0,0,.45);margin:2px 0;box-sizing:border-box}
.bank .tok[data-tok="0"]{--gc:#2fcf7a;--gg:rgba(47,207,122,.45)}.bank .tok[data-tok="1"]{--gc:#4c8dff;--gg:rgba(76,141,255,.45)}.bank .tok[data-tok="2"]{--gc:#ff4d6a;--gg:rgba(255,77,106,.45)}
.bank .tok[data-tok="3"]{--gc:#e8eef7;--gg:rgba(232,238,247,.45)}.bank .tok[data-tok="4"]{--gc:#8a8f9c;--gg:rgba(160,165,180,.35)}.bank .tok[data-tok="5"]{--gc:#f5c518;--gg:rgba(245,197,24,.5)}
.bank .tok.on{border-width:4px;box-shadow:inset 0 0 0 2px #fff,0 0 18px var(--gc),0 0 34px var(--gg)}
.bank .tok .gn{bottom:3px}.bank .tok span{right:-4px}
.cs .pt3{font:bold 108px "Times New Roman",serif;fill:#ffe9a8;stroke:#3a2400;stroke-width:6px;paint-order:stroke;text-anchor:middle}
.cs .cq3{font:bold 88px "Times New Roman",serif;fill:#fff;stroke:#000;stroke-width:5px;paint-order:stroke;text-anchor:middle}
/* nút bấm kiểu đá quý */
#dq .tbtn,.dqpop .tbtn{position:relative;overflow:hidden;border:2px solid #e9c46a;border-radius:14px;padding:9px 18px;font:bold 16px "Times New Roman",serif;letter-spacing:.03em;color:#fff;cursor:pointer;
  background:linear-gradient(160deg,#9a6cff 0%,#6a3fd8 45%,#3b1f8f 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 8px rgba(0,0,0,.35),0 4px 0 #6b4a1e,0 8px 16px rgba(0,0,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.6);transition:transform .15s,filter .15s,box-shadow .15s}
#dq .tbtn::before,.dqpop .tbtn::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-120%);transition:transform .6s}
#dq .tbtn:not(:disabled):hover::before,.dqpop .tbtn:not(:disabled):hover::before{transform:translateX(120%)}
#dq .tbtn:not(:disabled):hover,.dqpop .tbtn:not(:disabled):hover{transform:translateY(-2px);filter:brightness(1.12)}
#dq .tbtn:not(:disabled):active,.dqpop .tbtn:not(:disabled):active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 1px 0 #6b4a1e,0 3px 6px rgba(0,0,0,.4)}
#dq .tbtn.pri,.dqpop .tbtn.pri{background:linear-gradient(160deg,#4be38f 0%,#159a55 45%,#0b5c32 100%)}
#dq .tbtn.gold,.dqpop .tbtn.gold{color:#3d2a00;text-shadow:0 1px 0 rgba(255,255,255,.5);background:linear-gradient(160deg,#fff3a0 0%,#f5c518 40%,#b7791f 100%)}
#dq .tbtn:not(.pri):not(.gold),.dqpop .tbtn:not(.pri):not(.gold){background:linear-gradient(160deg,#6b7280 0%,#3f4654 50%,#23272f 100%)}
#dq .tbtn:disabled,.dqpop .tbtn:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 2px 0 #3a2a10}
.bank .tbtn{width:100%;padding:9px 4px!important}
.dqpop{padding:14px 16px!important;min-width:250px!important;background:linear-gradient(160deg,#2f2010,#160e05)!important;border:2px solid #e9c46a!important}
.dqpop .pb{margin-top:8px;gap:8px!important}
#dqzoom{position:fixed;inset:0;z-index:9999;background:rgba(10,6,3,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:20px;cursor:zoom-out;font-family:"Times New Roman",serif}
#dqzoom.on{display:flex;animation:dqzi .25s ease}@keyframes dqzi{from{opacity:0;transform:scale(.92)}}
#dqzoom .zc{width:min(420px,80vw,calc(85vh*5/7));aspect-ratio:5/7;filter:drop-shadow(0 20px 40px #000)}#dqzoom .zn{width:min(420px,80vw,70vh);aspect-ratio:1;filter:drop-shadow(0 20px 40px #000)}
#dqzoom svg{width:100%;height:100%;display:block}
#dqzoom .zi{color:#f3e2c0;max-width:300px;display:flex;flex-direction:column;gap:8px;font-size:15px}#dqzoom .zi b{font-size:28px;color:#e8c77a}#dqzoom .zi small{opacity:.6}
#dq{position:relative;margin:6px auto 14px;max-width:1360px;padding:16px 16px 18px;border-radius:22px;color:#f3ecdd;
  background:radial-gradient(ellipse at 50% 25%,rgba(255,220,150,.10),transparent 60%),radial-gradient(ellipse at 50% 35%,#21455a 0%,#122a39 55%,#08151f 100%);
  box-shadow:inset 0 0 80px rgba(0,0,0,.6),0 20px 50px rgba(10,20,40,.35);border:3px solid #6b4a1e;outline:2px solid #c9a24e;outline-offset:-8px}
#dq::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;opacity:.22;background:repeating-radial-gradient(circle at 30% 20%,transparent 0 2px,rgba(255,255,255,.05) 2px 3px)}
.dqwrap{position:relative;display:grid;grid-template-columns:auto 106px minmax(270px,330px);gap:16px;justify-content:center;align-items:start}
.dqboard{display:flex;flex-direction:column;gap:11px}
.nobles{display:flex;gap:12px;justify-content:center;margin-bottom:4px}
.dqn{position:relative;width:112px;transition:transform .25s,box-shadow .25s;border-radius:9px;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.dqn svg{display:block;width:112px;height:112px}.dqn span{position:absolute;left:30%;right:4%;bottom:3px;font-size:9.5px;color:#fff5d6;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.row{display:flex;gap:11px}
.dqc,.deck{position:relative;width:148px;height:207px;border-radius:10px;flex:none;cursor:pointer;transition:transform .25s ease,filter .25s;will-change:transform}.dqc{filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}.deck{box-shadow:0 10px 20px rgba(0,0,0,.55)}
.dqc svg,.deck svg{display:block;width:100%;height:100%}
.dqc.empty{background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.18);box-shadow:none;cursor:default}
.dqc.can{filter:drop-shadow(0 0 3px #4ade80) drop-shadow(0 0 10px rgba(74,222,128,.8)) drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.dqc.pk{filter:drop-shadow(0 0 4px #c4a5ff) drop-shadow(0 0 14px rgba(167,139,250,.95));transform:translateY(-8px) scale(1.05)}.deck.pk{box-shadow:0 0 0 4px #c4a5ff,0 0 28px rgba(167,139,250,.9);transform:translateY(-8px) scale(1.05)}
.dqc.deal{animation:dqdeal .7s cubic-bezier(.2,1.2,.3,1) both}@keyframes dqdeal{from{transform:perspective(600px) rotateY(180deg) translateY(-30px) scale(.7);opacity:0}}
.deck .dl{position:absolute;left:0;right:0;bottom:9px;text-align:center;color:#fff;text-shadow:0 1px 3px #000}.deck .dl b{display:block;font-size:22px;line-height:1}.deck .dl span{font-size:11.5px;letter-spacing:.04em}
.deck::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:3px 3px 0 #3b2a10,6px 6px 0 #241806;z-index:-1}
.cs .pt{font:bold 27px "Times New Roman",serif;fill:#fff;stroke:#3a2400;stroke-width:3.4px;paint-order:stroke;text-anchor:middle}
.cs .cn,.bon .cn,.ns .cn{font:bold 12.5px "Times New Roman",serif;fill:#fff;stroke:#000;stroke-width:2.6px;paint-order:stroke;text-anchor:middle}
.cn.dk{fill:#1d1b2e!important;stroke:#fff!important}
.cs .lvl{font-size:7px;fill:#fff;opacity:.75;text-anchor:end}
.ns .npt{font:bold 18px "Times New Roman",serif;fill:#fff;stroke:#6e4200;stroke-width:2.4px;paint-order:stroke;text-anchor:middle}
.shine{animation:shine 7s infinite;animation-delay:var(--d,0s)}@keyframes shine{0%,72%{transform:translateX(0)}100%{transform:translateX(230px)}}
.tw{animation:tw 3.4s infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,62%,100%{opacity:0;transform:scale(.15) rotate(0)}74%{opacity:1;transform:scale(1) rotate(45deg)}86%{opacity:0;transform:scale(.3) rotate(90deg)}}
.bank{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:18px;background:linear-gradient(180deg,rgba(80,50,20,.55),rgba(40,25,10,.55));border:2px solid rgba(201,162,78,.6);box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.bank .bt{font-weight:bold;font-size:15px;color:#ffe7a8;letter-spacing:.06em}.bank small{font-size:11px;color:#d9cdb2;text-align:center;line-height:1.2}
.tok{position:relative;width:82px;height:100px;cursor:pointer;transition:transform .2s,filter .2s}.tok svg{width:100%;height:100%;overflow:visible}
.tok:hover{transform:translateY(-4px) scale(1.05)}.tok.on{transform:translateY(-8px) scale(1.08);filter:drop-shadow(0 0 10px #c4a5ff) drop-shadow(0 0 4px #fff)}
.tok span{position:absolute;right:2px;bottom:20px;background:#1d1b2e;color:#fff;border:2px solid #c9a24e;border-radius:12px;font-size:13px;padding:0 7px;font-weight:bold}
.tok i{position:absolute;left:0;top:2px;background:#8a5cf6;color:#fff;border-radius:9px;font-size:12px;padding:0 6px;font-style:normal}
.tok.gold{cursor:default}
.players{display:flex;flex-direction:column;gap:9px}
.pl{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.18);border-radius:16px;padding:8px 10px;backdrop-filter:blur(4px);transition:box-shadow .3s}
.pl.turn{border-color:#fbbf24;box-shadow:0 0 0 1px #fbbf24,0 0 22px rgba(251,191,36,.45)}.pl.me{background:linear-gradient(160deg,rgba(196,165,255,.22),rgba(255,255,255,.05))}.pl.win{border-color:#4ade80;box-shadow:0 0 26px rgba(74,222,128,.6)}
.pl .ph{display:flex;align-items:center;gap:6px;font-size:15px}.pl .pts{margin-left:auto;font-size:26px;font-weight:bold;color:#ffd76a;text-shadow:0 0 10px rgba(255,200,80,.6);display:flex;align-items:baseline;gap:4px}.pl .pts small{font-size:11px;color:#d9cdb2;font-weight:normal}
.pl .gr{display:flex;gap:4px;margin-top:6px}.pl .gc{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.bon{width:30px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.resn{width:30px;height:40px;border-radius:5px;border:1.5px dashed rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:15px;line-height:1}.resn small{font-size:9px;opacity:.7}.resn em{font-size:9px;font-style:normal;opacity:.7}
.pl .tk{display:flex;align-items:center;gap:1px;font-size:13px}.pl .tk.z{opacity:.35}.pl .tk[data-ret]{cursor:pointer;background:rgba(239,68,68,.35);border-radius:8px;padding:0 3px;animation:tp 1s infinite}@keyframes tp{50%{transform:translateY(-3px)}}
.pl .ft{font-size:12px;color:#cfc4ad;margin-top:5px}
.tmr{background:#f59e0b;color:#fff;border-radius:10px;padding:0 6px;font-weight:bold;font-size:12px}
.mine{position:relative;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px auto 0;max-width:1180px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.18);border-radius:18px;padding:10px 14px}
.mine .rs{display:flex;gap:9px;align-items:center}.mine .rs .lb{font-size:12.5px;color:#d9cdb2;writing-mode:vertical-rl;transform:rotate(180deg)}.mine .rs em{color:#a99f8a;font-size:13px}
.mine .rs .dqc{width:76px;height:106px}
.mine .act{display:flex;gap:12px;align-items:center;flex-wrap:wrap;flex:1;min-width:260px;justify-content:center}.mine .warn{color:#fca5a5}.mine .big{font-size:20px;color:#ffd76a}
.mine .pv{width:76px;height:106px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}.mine .pv svg{width:100%;height:100%}
.pinfo{display:flex;flex-direction:column;gap:6px}.pay{display:flex;gap:8px;align-items:center;font-size:14px}.pay span{display:flex;align-items:center;gap:2px;font-weight:bold}.pb{display:flex;gap:8px}
.tbtn.gold{border:none;color:#3d2a00;background:linear-gradient(135deg,#fde047,#f59e0b);font-weight:bold}
.xlog{position:relative;width:min(1100px,94%);margin:12px auto 0;font-size:13.5px;color:#cfc4ad}.xlog div{border-bottom:1px dotted rgba(255,255,255,.15);padding:2px 0}
.fgem{overflow:visible}.fl{animation:fl 3.6s ease-in-out infinite;transform-box:view-box;transform-origin:0 0}@keyframes fl{0%,100%{transform:translateY(1.5px) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
.fsh{animation:fsh 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fsh{50%{transform:scale(.8);opacity:.25}}
.sweep{animation:sweep 3.8s ease-in-out infinite}@keyframes sweep{0%,55%{transform:skewX(-20deg) translateX(0)}100%{transform:skewX(-20deg) translateX(60px)}}
.tok:hover .fl{animation-duration:1.4s}.tok.on .fgem{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #c4a5ff)}
.cs .jn{font:bold 7.6px "Times New Roman",serif;fill:#ffeab0;text-anchor:middle;letter-spacing:.02em}
.cs .cq{font:bold 9.5px "Times New Roman",serif;fill:#fff;text-anchor:middle}
.tok .gn{position:absolute;left:-6px;right:-6px;bottom:0;text-align:center;font-style:normal;font-size:12.5px;font-weight:bold;color:#ffe7a8;text-shadow:0 1px 3px #000;letter-spacing:.02em}
.ns .kn{font:bold 8.4px "Times New Roman",serif;fill:#ffe7a8;text-anchor:middle}
.pl{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;border-left:6px solid var(--pc)!important}
.bagw{width:62px;height:66px}.bag{width:62px;height:66px;display:block;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}.bag .bgn{font:bold 15px "Times New Roman",serif;fill:#fff;text-anchor:middle;stroke:#0008;stroke-width:2.4px;paint-order:stroke}
.pl.turn .bag{animation:bagb 1.6s ease-in-out infinite}@keyframes bagb{50%{transform:translateY(-3px) rotate(-3deg)}}
.flm{animation:flm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}@keyframes flm{to{transform:scale(.85,1.12)}}
.pend{animation:pend 2s ease-in-out infinite;transform-box:view-box;transform-origin:0 -12px}@keyframes pend{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
.dqpop{position:fixed;z-index:250;min-width:220px;max-width:300px;padding:10px 12px;border-radius:14px;background:linear-gradient(160deg,#2b1d0e,#1a1208);border:2px solid #c9a24e;box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 4px rgba(201,162,78,.2);color:#f6ead0;display:flex;flex-direction:column;gap:7px;animation:popin .2s ease-out}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.dqpop>b{font-size:15px;color:#ffd76a}.dqpop .pay{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px}.dqpop .pay span{display:flex;align-items:center;gap:2px;font-weight:bold}.dqpop .warn{color:#fca5a5}.dqpop .pb{display:flex;gap:6px;flex-wrap:wrap}
.cs .pt2{font:bold 62px "Times New Roman",serif;fill:#ffe9a8;stroke:#3a2400;stroke-width:5px;paint-order:stroke;text-anchor:middle}
.cs .cq2{font:bold 32px "Times New Roman",serif;fill:#fff;text-anchor:middle}
.cs .jn2{font:bold 34px "Times New Roman",serif;fill:#fff3cf;stroke:#2a1606;stroke-width:4px;paint-order:stroke;text-anchor:middle;letter-spacing:.02em}.cs .jn2.dk{fill:#23262d;stroke:#f4f6fa;stroke-width:1.4px}
.shine2{animation:shine2 7s infinite}@keyframes shine2{0%,72%{transform:translateX(0)}100%{transform:translateX(900px)}}
.dqfly{position:fixed;z-index:300;pointer-events:none;filter:drop-shadow(0 10px 16px rgba(0,0,0,.55))}.dqfly svg{width:100%;height:100%;display:block}
.dqsp{position:fixed;z-index:301;width:7px;height:7px;margin:-3px;border-radius:50%;pointer-events:none;box-shadow:0 0 10px 3px rgba(255,240,180,.8)}
@media (max-width:1180px){ .dqwrap{grid-template-columns:auto 96px} .players{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.pl{flex:1;min-width:240px} .tok{width:74px;height:86px} }
@media (max-width:760px){ .dqc,.deck{width:72px;height:101px} .dqn,.dqn svg{width:70px;height:70px}.dqn span{display:none} .row{gap:6px} .tok{width:56px;height:66px} .dqwrap{gap:8px} #dq{padding:8px} }
@media (max-height:520px){ #dq{padding:6px;margin:2px;border-radius:12px;outline:none} .dqwrap{grid-template-columns:auto 62px minmax(200px,250px);gap:8px}
  .players{grid-column:auto;flex-direction:column}.pl{min-width:0;padding:4px 6px}
  .dqc,.deck{width:58px;height:81px;border-radius:6px} .row,.dqboard{gap:5px} .nobles{gap:5px} .dqn,.dqn svg{width:52px;height:52px}.dqn span{display:none}
  .deck .dl b{font-size:13px}.deck .dl span{display:none}.deck .dl{bottom:3px}
  .tok{width:50px;height:50px}.tok span{font-size:10px;padding:0 4px;bottom:0}.bank{padding:4px 3px;gap:2px}.bank small{display:none}.bank .bt{font-size:11px} .bank .tbtn{padding:4px 6px;font-size:12px}
  .pl .ph{font-size:13px}.pl .pts{font-size:18px}.bon,.resn{width:21px;height:28px} .pl{grid-template-columns:40px 1fr;gap:4px} .bagw,.bag{width:40px;height:43px} .tok .gn{font-size:9px} .tok{height:58px} .tok span{bottom:12px}.pl .tk{font-size:11px}.pl .tk svg{width:12px;height:12px}.pl .ft{display:none}
  .mine{position:fixed;left:auto;right:8px;bottom:6px;width:250px;z-index:20;margin:0;border-radius:12px;padding:4px 6px;gap:4px;background:rgba(12,28,40,.95);justify-content:flex-start} .mine .rs em{display:none} .pb .tbtn{padding:4px 7px;font-size:12px} .pay{font-size:12px} .pinfo{gap:3px} .pinfo>b{font-size:12px} .mine .rs .lb{display:none} .mine .rs .dqc,.mine .pv{width:40px;height:56px} .mine .act{min-width:0;font-size:13px;gap:6px} .xlog{display:none} }

/* ===== bố cục mới: vừa 1 màn hình ===== */
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.stat{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1.5px solid rgba(201,162,78,.55);border-radius:12px;padding:7px 12px;font-size:15px;line-height:1.3}
.stat .me{color:#ffd76a}.stat .warn{color:#fca5a5}.stat .big{font-size:18px;color:#ffd76a}
.goldbox{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px;padding:6px 4px 4px;border-top:2px dashed rgba(253,224,71,.55);width:100%}
.goldbox .bt{color:#fde047;font-size:14px}
.bank .gems{display:flex;flex-direction:column;align-items:center;gap:2px}
.bon.gph{visibility:hidden}
.pl{grid-template-columns:56px 1fr auto!important}
.rsv{display:flex;gap:4px;align-items:center}
.rslot{width:44px;height:62px;border:1.5px dashed rgba(255,255,255,.2);border-radius:5px}
.rcd,.rsv .dqc{width:44px!important;height:62px!important;border-radius:5px;flex:none}
.rcd svg{width:100%;height:100%;display:block}
.rb{filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
@media (min-width:1000px) and (min-height:600px){
 #dq{height:var(--H,calc(100vh - 70px));box-sizing:border-box;margin:0 auto;max-width:1900px;padding:12px 14px;overflow:hidden;
   --ch:calc((var(--H,780px) - 70px)/3.62);--cw:calc(var(--ch)*.715)}
 .dqwrap{height:100%;grid-template-columns:auto calc(var(--ch)*.55) minmax(330px,1fr);gap:14px;align-items:stretch}
 .dqboard{gap:8px;justify-content:center}
 .nobles{gap:10px;margin:0}
 .dqn,.dqn svg{width:calc(var(--ch)*.56);height:calc(var(--ch)*.56)}
 .row{gap:8px}
 .dqc,.deck{width:var(--cw);height:var(--ch)}
 .bank{justify-content:center;padding:8px 4px;gap:4px}
 .tok{width:calc(var(--ch)*.38);height:calc(var(--ch)*.395)}
 .bank{justify-content:space-between!important}
 .bank .tok svg{height:82%}
 .pcn{min-width:0}
 .goldbox .gn{display:none}
 .goldbox .bt{font-size:13px}
 .bank small{font-size:11px}
 .side{height:100%;max-width:620px}
 .players{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;justify-content:flex-start}
 .pl{padding:6px 10px}
 .pl .ph{font-size:15px}.pl .pts{font-size:24px}
 .pl .ft{font-size:11.5px;margin-top:3px}
 /* người đang tới lượt: phóng to khu đá */
 .pl.turn{padding:10px 12px}
 .pl.turn .bon{width:44px;height:58px}
 .pl.turn .tk{font-size:18px;gap:3px}.pl.turn .tk svg{width:26px;height:26px}
 .pl.turn .pts{font-size:34px}.pl.turn .ph{font-size:17px}
 .pl.turn .rcd,.pl.turn .rsv .dqc,.pl.turn .rslot{width:60px!important;height:84px!important}
 .pl.turn .bagw,.pl.turn .bag{width:66px;height:70px}
 .pl.turn{grid-template-columns:66px 1fr auto!important}
 .xlog{width:auto;margin:0;font-size:12.5px;max-height:84px;overflow:hidden}
 .mine{display:none}
}
@media (min-width:1000px) and (min-height:600px) and (max-width:1300px){ .dqwrap{grid-template-columns:auto calc(var(--ch)*.5) minmax(300px,1fr);gap:10px} .rcd,.rsv .dqc,.rslot{width:36px!important;height:50px!important} }

@media (max-height:520px){ .rcd,.rsv .dqc,.rslot{width:22px!important;height:31px!important;border-radius:3px} .rsv{flex-direction:column;gap:2px} .pl{grid-template-columns:36px 1fr auto!important} .stat{font-size:11px;padding:3px 6px} .stat .big{font-size:13px} .goldbox{margin-top:2px;padding-top:2px} .goldbox small,.goldbox .bt{display:none} .side{gap:4px} .pcn{min-width:0} .goldbox .gn{display:none} }
@media (max-width:999px) and (min-height:521px){ .side{grid-column:1/-1} .players{flex-direction:row;flex-wrap:wrap} }

/* viền đá ngân khố: vòng vàng mảnh lấp lánh */
.bank .tok{border:none!important;background:none!important;box-shadow:none!important;margin:1px 0}
.bank .tok svg{position:relative;z-index:2}
.bank .tok span,.bank .tok .gn,.bank .tok i{z-index:3}
.bank .tok::before{content:"";position:absolute;left:50%;top:42%;width:min(92%,calc(var(--ch,200px)*.36));aspect-ratio:1;border-radius:50%;padding:2px;box-sizing:border-box;z-index:1;
  background:conic-gradient(#6b4a12,#ffe9a8 8%,#b8892e 18%,#fff9e0 26%,#8a6418 38%,#e9c46a 52%,#fffbe8 60%,#9a7020 72%,#ffe9a8 86%,#6b4a12);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  transform:translate(-50%,-50%);animation:ringspin 7s linear infinite;filter:drop-shadow(0 0 2px rgba(255,233,168,.55))}
.bank .tok::after{content:"";position:absolute;left:50%;top:42%;width:min(84%,calc(var(--ch,200px)*.33));aspect-ratio:1;border-radius:50%;z-index:1;transform:translate(-50%,-50%) scale(.7);
  background:radial-gradient(circle,var(--gc) 0%,color-mix(in srgb,var(--gc) 55%,transparent) 35%,transparent 70%);opacity:0;transition:opacity .25s,transform .25s}
@keyframes ringspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.bank .tok.on::before{background:conic-gradient(var(--gc),#fff 10%,var(--gc) 25%,color-mix(in srgb,var(--gc) 60%,#000) 45%,#fff 60%,var(--gc) 75%,color-mix(in srgb,var(--gc) 60%,#000) 90%,var(--gc));padding:3px;filter:drop-shadow(0 0 4px var(--gc)) drop-shadow(0 0 7px var(--gc));animation-duration:2.4s}
.bank .tok.on::after{opacity:.95;transform:translate(-50%,-50%) scale(1);animation:gpulse 1.4s ease-in-out infinite}
@keyframes gpulse{50%{opacity:.6}}
.bank .tok.on{filter:none!important;transform:translateY(-3px) scale(1.04)!important}
.bank .tok.on .fgem{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px var(--gc))!important}
.bank .tok[data-tok="4"]{--gc:#b9c0d0}

/* viền bạch kim thay vàng kim */
.bank .tok::before{background:conic-gradient(#5b6270,#f4f7fb 8%,#9aa3b2 18%,#ffffff 26%,#6b7383 38%,#d5dbe5 52%,#ffffff 60%,#7a8292 72%,#eef2f8 86%,#5b6270)!important;filter:drop-shadow(0 0 2px rgba(220,230,245,.6))!important}
.bank .tok[data-tok="4"]{--gc:#a855f7}
.bank .tok .gn{font-size:10px!important;font-weight:normal!important;color:#cfc4ad!important;letter-spacing:0}

/* nền tiệc quý tộc vẽ tay, hơi mờ */
#dq{background:#2a1d12!important;isolation:isolate;overflow:hidden}
#dq::before{content:"";position:absolute;inset:-12px;z-index:-2;background:url(assets/damask.svg) 0 0/84px 116px repeat;filter:none;opacity:1;border-radius:0}
#dq::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 40%,rgba(255,220,160,.10),rgba(20,6,10,.45) 95%),linear-gradient(rgba(60,10,25,.15),rgba(60,10,25,.15));pointer-events:none;box-shadow:inset 0 0 0 6px rgba(201,162,78,.55),inset 0 0 40px rgba(0,0,0,.5)}
.bank,.pl,.stat,.xlog{backdrop-filter:blur(2px)}
.pl{background:linear-gradient(160deg,rgba(40,26,14,.78),rgba(25,16,8,.72))!important}
.bank{background:linear-gradient(180deg,rgba(40,26,14,.8),rgba(25,16,8,.75))!important}
.stat{background:rgba(35,22,10,.75)!important}
.xlog{background:rgba(35,22,10,.6);border-radius:10px;padding:6px 10px!important}

.dqn{transition:transform .2s}.dqn:hover{transform:translateY(-3px) scale(1.04)}
@media (min-width:1000px) and (min-height:600px){ .dqn,.dqn svg{width:calc(var(--ch)*.68);height:calc(var(--ch)*.68)} }
.pl{position:relative}
.pl.turn{border:3px solid var(--pc,#fbbf24)!important;animation:turnGlow 1.4s ease-in-out infinite}
@keyframes turnGlow{0%,100%{box-shadow:0 0 0 2px rgba(255,230,140,.9),0 0 14px var(--pc,#fbbf24)}50%{box-shadow:0 0 0 2px rgba(255,255,255,1),0 0 32px 6px var(--pc,#fbbf24)}}
.tbadge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font:bold 12px "Times New Roman",serif;font-style:normal;padding:2px 10px;border-radius:9px;background:linear-gradient(#ffe48a,#c99626);color:#3b2406;border:1px solid #fff3c4;white-space:nowrap;z-index:3;animation:blinkTxt 1s steps(1) infinite alternate,none}
.blink{animation:blinkTxt .9s ease-in-out infinite}
@keyframes blinkTxt{0%,100%{opacity:1;text-shadow:0 0 10px #ffd76a}50%{opacity:.25;text-shadow:none}}
.tbadge{animation:badgePulse 1s ease-in-out infinite}
@keyframes badgePulse{50%{opacity:.55;transform:translateX(-50%) scale(.94)}}
.bon{filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)) drop-shadow(0 0 2px rgba(255,255,255,.25))}
.bon .cn{fill:#fff;stroke:#000;stroke-width:3px}

.hbtn{float:right;margin:0 0 4px 8px;font:bold 12.5px "Times New Roman",serif;padding:3px 10px;border-radius:9px;cursor:pointer;color:#3b2406;background:linear-gradient(#ffe48a,#c99626);border:1px solid #fff3c4;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.hbtn:hover{filter:brightness(1.1)}
.lg{display:inline-flex;align-items:center;gap:2px;vertical-align:-4px;white-space:nowrap}.lg svg{width:18px;height:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.lg b{font-weight:bold}.lg0{color:#34d399}.lg1{color:#60a5fa}.lg2{color:#f87171}.lg3{color:#f1f5f9}.lg4{color:#c4b5fd}.lg5{color:#fcd34d}
.dqhist{max-height:60vh;overflow:auto;font-size:15px;text-align:left}.dqhist div{padding:5px 4px;border-bottom:1px dashed rgba(0,0,0,.15)}.dqhist i{display:inline-block;min-width:30px;color:#999;font-style:normal;font-size:12px}
.dqhist .lg0{color:#047857}.dqhist .lg1{color:#1d4ed8}.dqhist .lg2{color:#b91c1c}.dqhist .lg3{color:#64748b}.dqhist .lg4{color:#111}.dqhist .lg5{color:#a16207}
.tb-top .home{font-weight:bold}

.bgd{font-weight:normal;opacity:.85}
.deck .dl{left:7px!important;right:auto!important;top:6px!important;bottom:auto!important;text-align:left!important;background:rgba(0,0,0,.45);border-radius:6px;padding:1px 5px;line-height:1.1}
.deck .dl b{display:inline!important;font-size:12px!important;margin-right:3px}.deck .dl span{display:inline!important;font-size:9px!important;opacity:.85;letter-spacing:0}
.pts.up{animation:ptsUp 1.2s ease-out}
@keyframes ptsUp{0%{transform:scale(1)}25%{transform:scale(1.7);color:#fff6b0;text-shadow:0 0 16px #ffd76a}100%{transform:scale(1)}}
.pl .pts{display:inline-block;transform-origin:center}

.bag .bgn{font:bold 17px "Times New Roman",serif!important;fill:#fff!important;stroke:#1a0b2e!important;stroke-width:3.2px!important;paint-order:stroke!important;opacity:1!important}
.bag .bgd{stroke-width:2.6px}
#tb-modal{z-index:100000!important}

.ovl{position:absolute;left:8px;top:8px;z-index:4;font:bold 11px "Times New Roman",serif;font-style:normal;color:#fff;background:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:1px 6px;animation:blinkTxt .8s ease-in-out infinite;white-space:nowrap}
.bagw.over .bag{filter:drop-shadow(0 0 8px #ef4444) drop-shadow(0 0 3px #ef4444)}.bagw.over .bgn{fill:#fecaca!important}
`;
Table.init({ id:'da-quy', prefix:'dq', title:'Thương Nhân Đá Quý', tagline:'Gom đá quý, mua mỏ và thương điếm, mời quý tộc ghé thăm',
  minPlayers:2, maxPlayers:4, botOptions:[1,2,3], defaultBots:1, turnLimit:60, botDelay:600, css:CSS,
  newGame:DQ.newGame, apply:DQ.apply, tick:DQ.tick, whoActs:DQ.whoActs, botAction:DQ.botAction, timeoutAction:DQ.timeoutAction,
  render:DQUI.render, tickView:DQUI.tickView,
  rules:`<p><b>Mục tiêu:</b> là người đầu tiên đạt <b>${DQ_WIN} điểm uy tín</b>. Khi có người đạt, mọi người chơi nốt vòng đó rồi so điểm (bằng điểm thì ai mua ít thẻ hơn thắng).</p>
  <p><b>Mỗi lượt chọn 1 việc:</b></p>
  <p>• <b>Lấy 3 viên đá khác màu</b>, hoặc <b>2 viên cùng màu</b> (chỉ khi ngân khố còn từ 4 viên màu đó).</p>
  <p>• <b>Giữ chỗ</b> 1 thẻ (trên bàn hoặc úp từ chồng bài) và nhận 1 viên <b>Vàng</b> — vàng thay được mọi màu. Giữ tối đa 3 thẻ.</p>
  <p>• <b>Mua</b> 1 thẻ trên bàn hoặc thẻ đang giữ: trả số đá ghi ở góc dưới. Mỗi thẻ đã mua cho bạn <b>giảm giá vĩnh viễn 1 viên</b> màu của thẻ đó. Thẻ có viền xanh là thẻ bạn mua được ngay.</p>
  <p><b>Quý tộc:</b> khi số thẻ bạn sở hữu đủ yêu cầu của một quý tộc, quý tộc tự ghé thăm, cộng 3 điểm.</p>
  <p><b>Giới hạn 10 viên:</b> trong lượt bạn được phép có hơn 10 viên. Chỉ khi kết thúc lượt mới kiểm tra: nếu túi quá tải (hơn 10 viên), bạn chọn trả bớt những viên tùy ý cho đến khi còn đúng 10 viên, rồi lượt chuyển sang người tiếp theo. Mỗi lượt có 60 giây.</p>` });
</script>
