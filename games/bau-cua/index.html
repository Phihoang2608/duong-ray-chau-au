<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bầu Cua Tôm Cá | Phi Board Games</title>
</head>
<body>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../../core/room.js"></script>
<script src="../../core/audio.js"></script>
<script src="../../core/effects.js"></script>
<script src="../../core/table.js?v=20261128mig"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script>
const CSS=`
.bc{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;padding:12px;max-width:1280px;margin:0 auto}
.bc-main{display:flex;flex-direction:column;gap:12px}
.bc-top{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#7a1f2b,#b5332f);border-radius:24px;padding:14px 20px;color:#fff;box-shadow:0 14px 30px rgba(122,31,43,.25)}
.bowlwrap{position:relative;width:210px;height:150px;flex:none}
.plate{position:absolute;left:5px;right:5px;bottom:4px;height:64px;border-radius:50%;background:radial-gradient(ellipse,#fff 0,#f3e8d8 60%,#d9c3a3 100%);box-shadow:0 8px 16px rgba(0,0,0,.35)}
.dice{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:6px}
.die{width:52px;height:52px;border-radius:10px;background:#fff;border:2px solid #e7dccb;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 4px 8px rgba(0,0,0,.25);padding:3px}
.die.q{background:#f3ede3}
.show .die{animation:dpop .5s cubic-bezier(.2,1.6,.4,1) both}.show .die:nth-child(2){animation-delay:.12s}.show .die:nth-child(3){animation-delay:.24s}
@keyframes dpop{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.bowl{position:absolute;left:28px;right:28px;bottom:26px;height:98px;border-radius:120px 120px 24px 24px;background:radial-gradient(ellipse at 35% 25%,#e7c46a,#b8862b 60%,#7d5a17);box-shadow:inset 0 -10px 18px rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff7d6;transition:transform .7s cubic-bezier(.5,-.3,.3,1.3),opacity .7s}
.bowl::before{content:"";position:absolute;top:-10px;left:50%;width:30px;height:16px;margin-left:-15px;border-radius:50%;background:#8d651d}
.bowlwrap.roll .bowl,.bowlwrap.roll .plate{animation:shake .22s infinite}
@keyframes shake{25%{transform:translate(-6px,-3px) rotate(-4deg)}75%{transform:translate(6px,2px) rotate(4deg)}}
.bowlwrap.show .bowl{transform:translate(110px,-80px) rotate(28deg);opacity:0}
.bc-info{flex:1;min-width:0}
.rnd{font-size:13px;letter-spacing:.2em;opacity:.8}.st{font-size:28px;margin:2px 0 6px}
.cd{display:inline-block;background:rgba(255,255,255,.18);padding:3px 14px;border-radius:14px;font-size:16px}.cd b{font-size:22px}.cd.hot{background:#fde047;color:#7a1f2b;animation:shake .4s infinite}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hist span{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:8px;padding:3px}
.hist i{width:22px;height:22px;background:#fff;border-radius:5px;display:inline-block}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;border-radius:24px;background:repeating-linear-gradient(45deg,#fff7ec 0 10px,#fff2e0 10px 20px);border:3px solid #e9c46a;box-shadow:0 10px 26px rgba(122,31,43,.15)}
.tile{position:relative;border:3px solid var(--c);border-radius:18px;background:#fff;cursor:pointer;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;transition:transform .18s,box-shadow .2s;font-family:inherit;color:#1d1b2e}
.tile:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 12px 22px rgba(0,0,0,.15)}
.tile:disabled{cursor:default}
.tile .art{width:min(110px,70%);aspect-ratio:1}
.tile .nm{font-size:22px;font-weight:bold;color:var(--c)}
.tile .tot{font-size:13px;color:#8b889c;min-height:18px}
.tile .mychip{position:absolute;top:8px;right:8px;min-width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#ffd36b,#e0a526);border:3px dashed #fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.tile .avs{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:2px}.tile .avs .av{width:20px;height:20px;font-size:11px}
.tile.win{box-shadow:0 0 0 4px #fde047,0 0 30px rgba(253,224,71,.9);animation:wglow 1s ease-in-out infinite;background:#fffbe6}
@keyframes wglow{50%{box-shadow:0 0 0 4px #fde047,0 0 12px rgba(253,224,71,.5)}}
.tile.lose{opacity:.45;filter:grayscale(.4)}
.tile .mul{position:absolute;bottom:8px;right:10px;font-size:22px;font-weight:bold;color:#b5332f}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.chips{display:flex;gap:8px}
.chip{width:54px;height:54px;border-radius:50%;border:4px dashed rgba(255,255,255,.85);color:#fff;font-weight:bold;cursor:pointer;font-family:inherit;font-size:15px;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .15s}
.chip.c10{background:#3fa9f5}.chip.c50{background:#22b38a}.chip.c100{background:#8a5cf6}.chip.c500{background:#e11d48}
.chip.on{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 3px #fde047,0 8px 16px rgba(0,0,0,.3)}.chip:disabled{opacity:.35;cursor:not-allowed}
.cbtn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mc b{font-size:19px;color:#b5332f}
.note{margin:0;text-align:center;font-size:13px;color:#8b889c}
.bc-side{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:20px;padding:12px 14px;align-self:start;position:sticky;top:66px}
.bc-side h3{margin:4px 0 8px;font-size:17px}
.pl{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px}.pl.me{background:#fff3f7}
.pl .pi{flex:1;min-width:0}.pc2{font-size:13px;color:#555268}
.dl{font-weight:bold;border-radius:10px;padding:1px 8px;animation:dpop .4s}.dl.up{background:#dcfce7;color:#15803d}.dl.down{background:#fee2e2;color:#b91c1c}
.rd{font-size:12px;color:#8b889c}.rd.y{color:#15803d}
.bc-side .lg div{font-size:13.5px;border-bottom:1px dotted #e6e1f5;padding:3px 0;color:#555268}
@media (max-width:900px){ .bc{grid-template-columns:1fr} .bc-side{position:static} .bc-top{flex-direction:column;text-align:center} .hist{justify-content:center} }
@media (max-width:560px){ .board{gap:8px;padding:8px} .tile .nm{font-size:17px} .chip{width:46px;height:46px} .st{font-size:22px} }
@media (max-height:520px) and (orientation:landscape){ .bc{grid-template-columns:minmax(0,1fr) 230px;padding:6px;gap:8px} .bc-top{flex-direction:row;padding:6px 12px} .bowlwrap{transform:scale(.7);margin:-22px -30px} .st{font-size:18px} .board{grid-template-columns:repeat(6,1fr);gap:6px;padding:6px} .tile .nm{font-size:14px} .tile .art{width:80%} .chip{width:42px;height:42px} }
`;
Table.init({ id:'bau-cua', prefix:'bc', title:'Bầu Cua Tôm Cá', tagline:'Đặt cược vào con vật, lắc bát và mở xem — chơi bằng xu ảo',
  minPlayers:1, maxPlayers:6, botOptions:[0,1,2,3,4,5], defaultBots:3, botDelay:500, css:CSS,
  newGame:BC.newGame, apply:BC.apply, tick:BC.tick, whoActs:BC.whoActs, botAction:BC.botAction,
  render:BCUI.render, tickView:BCUI.tickView,
  rules:`<p><b>Cách chơi:</b> mỗi ván có 20 giây để đặt cược. Chọn mệnh giá xu (10, 50, 100, 500) rồi bấm vào con vật muốn đặt. Có thể đặt nhiều con, nhiều lần. Xong bấm <b>Chốt cược</b>.</p>
  <p><b>Lắc bát:</b> nhà cái lắc 3 viên xúc xắc, mỗi mặt là một con: Nai, Bầu, Gà, Cá, Cua, Tôm.</p>
  <p><b>Trả thưởng:</b> con bạn đặt ra 1 mặt thì được gấp 1 lần tiền cược, ra 2 mặt được gấp 2, ra 3 mặt được gấp 3 (cộng lại tiền cược). Con không ra thì mất tiền cược.</p>
  <p>Mỗi người bắt đầu với 1.000 xu. Hết xu sẽ được tiếp tế 500 xu. <b>Xu ảo chỉ để giải trí, không quy đổi thành tiền.</b></p>` });
</script>
</body>
</html>
