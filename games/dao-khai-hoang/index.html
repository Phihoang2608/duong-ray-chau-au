<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Khai Hoang | Phi Board Games</title>
</head>
<body>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../../core/room.js"></script>
<script src="../../core/audio.js"></script>
<script src="../../core/effects.js"></script>
<script src="../../core/table.js"></script>
<script src="../../core/cards.js"></script>
<script src="game.js?v=20261127d"></script>
<script src="assets/imgs.js?v=20261127d"></script>
<script src="art.js?v=20261127d"></script>
<script src="ui.js?v=20261127d"></script>
<script>
const CSS=`#kh{padding:8px 10px 14px;min-height:calc(100vh - 60px);background:radial-gradient(ellipse at 40% 30%,#6b4524 0%,#4a2d15 55%,#2c1a0b 100%);color:#f6ead0}
#kh::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(92deg,transparent 0 22px,rgba(0,0,0,.25) 22px 24px,transparent 24px 60px),repeating-linear-gradient(88deg,rgba(255,220,170,.06) 0 3px,transparent 3px 9px)}
.khwrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;max-width:1380px;margin:0 auto;align-items:start}
.kbwrap{position:relative}
.frame{position:relative;border-radius:26px;padding:10px;background:linear-gradient(145deg,#a5743f,#5e3a18 40%,#8a5a2c 70%,#4a2c10);box-shadow:0 22px 50px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,230,190,.5),inset 0 -3px 8px rgba(0,0,0,.5)}
.frame::after{content:"";position:absolute;inset:6px;border-radius:21px;border:2px solid rgba(255,225,170,.35);pointer-events:none}
#khs{display:block;width:100%;height:calc(100vh - 110px);min-height:440px;border-radius:18px;background:#0d4a7a}
#khd{position:absolute;left:10px;top:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.kst{position:absolute;left:50%;top:20px;transform:translateX(-50%);background:rgba(30,18,8,.82);color:#ffecc0;border:1.5px solid #c9a24e;border-radius:18px;padding:5px 18px;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;z-index:3}
.kst b{color:#ffd76a}
#khs text,#khd text{font-family:"Times New Roman",serif;text-anchor:middle}
#khs .nm{font-size:18px;font-weight:bold;fill:#2b2214}#khs .nm.hot{fill:#c0262d}#khs .nm.sh{fill:#fff;opacity:.8}
#khs .pt{font-size:9.5px;font-weight:bold;fill:#3b2a14}
.waves{animation:wave 7s linear infinite}@keyframes wave{to{transform:translateX(60px)}}
.foam{animation:foam 3.5s ease-in-out infinite}@keyframes foam{50%{opacity:.25}}
.smoke{animation:smoke 3.3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.7}100%{transform:translate(6px,-22px) scale(2.2);opacity:0}}
.mill{animation:mill 6s linear infinite;transform-origin:0px -13px}@keyframes mill{to{transform:rotate(360deg)}}
.glint{animation:gl 3s infinite;transform-box:fill-box;transform-origin:center;opacity:0}@keyframes gl{0%,80%,100%{opacity:0;transform:scale(.2)}88%{opacity:.95;transform:scale(1)}}
.boat{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(2.5px) rotate(2deg)}}
#khd .hot{fill:rgba(255,226,110,.28);stroke:#ffd54a;stroke-width:5;animation:hot 1.6s ease-out 2 both;pointer-events:none}#khd .hot.blocked{fill:rgba(0,0,0,.35);stroke:#ef4444}@keyframes hot{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#khd .pickh{fill:rgba(255,255,255,.02);stroke:#fff;stroke-width:3;stroke-dasharray:8 6;cursor:pointer;animation:ph 1.2s infinite}#khd .pickh:hover{fill:rgba(255,220,120,.3)}#khd .pickh.on{fill:rgba(239,68,68,.25);stroke:#ef4444}@keyframes ph{50%{stroke-opacity:.35}}
#khd .spot{stroke:var(--pc);stroke-width:10;stroke-linecap:round;opacity:.45;cursor:pointer;animation:sp 1s infinite;filter:drop-shadow(0 0 4px #fff)}#khd .spot:hover{opacity:1}@keyframes sp{50%{opacity:.9}}
#khd .vspot{fill:#fff;stroke:var(--pc,#8a5cf6);stroke-width:4;cursor:pointer;animation:vs 1s infinite;filter:drop-shadow(0 0 5px #fff)}#khd .vspot:hover{fill:#fde047}#khd .vspot.ring{fill:rgba(255,255,255,.15);stroke:#fde047}@keyframes vs{50%{r:12}}
#khd .newp{animation:np .6s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center bottom}@keyframes np{0%{transform:scale(0) translateY(-30px);opacity:0}}
#khd .dust{fill:#e9dcc0;animation:dust .8s ease-out both;transform-box:fill-box;transform-origin:center}@keyframes dust{0%{opacity:.9;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.2)}}
#khd .drop{animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}@keyframes drop{0%{transform:translateY(-70px);opacity:0}}
.side{position:relative;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 76px);overflow-y:auto;padding-right:3px}
.box,.dice,.pl{background:linear-gradient(160deg,rgba(255,240,210,.14),rgba(255,240,210,.05));border:1.5px solid rgba(255,225,170,.25);border-radius:15px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.dice{display:flex;align-items:center;gap:8px}.die{width:46px;height:46px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}.dice b{font-size:28px;color:#ffd76a;min-width:32px;text-shadow:0 0 10px rgba(255,200,80,.6)}.dice span{color:#cdbb96;flex:1}.dice .tbtn{margin-left:auto}
.dice.rolling .die{animation:roll .8s cubic-bezier(.3,1.4,.5,1)}.dice.rolling .die:nth-child(2){animation-delay:.08s}@keyframes roll{0%{transform:translate(-60px,-30px) rotate(-540deg) scale(.5)}60%{transform:translate(6px,4px) rotate(20deg) scale(1.1)}}
.pls{display:flex;flex-direction:column;gap:6px}.pl{border-left:7px solid var(--pc);transition:box-shadow .3s}.pl.turn{box-shadow:0 0 0 2px var(--pc),0 0 20px color-mix(in srgb,var(--pc) 60%,transparent)}.pl.win{background:rgba(74,222,128,.18)}
.pl .ph{display:flex;align-items:center;gap:6px;font-size:15px}.pl .pk{width:22px;height:26px}.pl .vp{margin-left:auto;font-size:24px;font-weight:bold;color:#ffd76a;display:flex;align-items:baseline;gap:3px}.pl .vp small{font-size:11px;color:#cdbb96;font-weight:normal}
.pl .ps{display:flex;gap:10px;font-size:12.5px;color:#e2d3b2;flex-wrap:wrap}.pl .aw{margin-top:3px;display:flex;gap:5px}.pl em{font-style:normal;font-size:11.5px;background:linear-gradient(135deg,#fde68a,#f59e0b);border-radius:6px;padding:0 6px;color:#5a3500;font-weight:bold}
.tmr{background:#f59e0b;color:#fff;border-radius:10px;padding:0 6px;font-weight:bold;font-size:12px}
.hand{display:flex;gap:4px;justify-content:space-between;padding:10px 8px 8px}
.rstack{position:relative;width:62px;height:54px}.rstack .rc{position:absolute;left:calc(var(--k)*4px);top:calc(var(--k)*-3px + 6px);width:60px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));transition:transform .2s}.rstack .rc svg{width:100%;height:100%;display:block}
.rstack:hover .rc{transform:translateY(calc(var(--k)*-4px)) rotate(calc(var(--k)*4deg))}
.rstack b{position:absolute;right:-2px;bottom:-4px;background:#1d140a;color:#ffd76a;border:2px solid #c9a24e;border-radius:12px;font-size:14px;padding:0 7px;z-index:2}.rstack.none{opacity:.35;filter:grayscale(.6)}
@font-face{font-family:"KhFont";font-weight:800;src:url(assets/fonts/baloo-2-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"KhFont";font-weight:800;src:url(assets/fonts/baloo-2-vietnamese-800-normal.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
.dcard .rn{stroke-width:2px!important}.rcard .rn{font:800 14px "KhFont","Baloo 2","Arial Black",sans-serif;fill:#fff;text-anchor:middle;stroke:#1b0f06;stroke-width:3.2px;paint-order:stroke;stroke-linejoin:round}
.bl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bld{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:13.5px;background:linear-gradient(180deg,#fff9ec,#f1e2c0);color:#3b2a14;border:1.5px solid #c9a24e}.bld span{display:flex;gap:3px}.bld .cr{display:flex;background:rgba(0,0,0,.06);border-radius:6px;padding:0 2px}
.bld.on{box-shadow:0 0 0 3px #fde047,0 0 14px rgba(253,224,71,.7);background:#fff6d0}
.dvl{display:flex;gap:8px;flex-wrap:wrap}.dcard{position:relative;width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}.dcard svg{width:62px;height:87px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5));transition:transform .2s}.dcard:hover svg{transform:translateY(-4px) rotate(-2deg)}
.dcard>b{position:absolute;top:-4px;right:-2px;background:#1d140a;color:#ffd76a;border:2px solid #c9a24e;border-radius:10px;font-size:12px;padding:0 5px}.dcard.new svg{opacity:.6}.dcard small{color:#cdbb96}
.dpick{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;margin-top:6px}
.tr{font-size:13.5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}.tr select{font-family:inherit;font-size:13.5px;border:1px solid #c9a24e;border-radius:8px;padding:2px 4px;background:#fff9ec}
.tbtn.sm{padding:3px 9px;font-size:13px}.tbtn.wide{width:100%}.tbtn.gold{border:none;color:#3d2a00;background:linear-gradient(135deg,#fde047,#f59e0b);font-weight:bold;margin-top:6px}
.xlog{font-size:12.5px;color:#d9c9a6}.xlog div{border-bottom:1px dotted rgba(255,225,170,.2);padding:2px 0}
.khfly{position:fixed;z-index:300;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}.khfly svg{width:100%;height:100%;display:block}
.khback{width:100%;height:100%;border-radius:6px;border:3px solid #fff;background:repeating-linear-gradient(45deg,#8a1d2c 0 6px,#6b1422 6px 12px)}
@media (max-width:900px){ .khwrap{grid-template-columns:1fr} #khs{height:auto;max-height:70vh} .side{max-height:none} }
@media (max-height:520px){ #kh{padding:3px;min-height:0} .khwrap{grid-template-columns:minmax(0,1fr) 310px;gap:6px} .frame{padding:5px;border-radius:14px} #khd{left:5px;top:5px;width:calc(100% - 10px);height:calc(100% - 10px)} #khs{height:calc(100vh - 70px);min-height:0;max-height:none;border-radius:10px}
  .side{max-height:calc(100vh - 60px)} .kst{font-size:12px;padding:2px 10px;top:8px} .xlog{display:none} .pl .ps{font-size:11px;gap:6px} .box,.dice,.pl{padding:4px 6px} .die{width:34px;height:34px} .rstack{width:58px;height:48px}.rstack .rc{width:54px;height:41px} }
`;
Table.init({ id:'dao-khai-hoang', prefix:'kh', title:'Đảo Khai Hoang', tagline:'Khai thác tài nguyên, xây làng mở đường trên hòn đảo mới',
  minPlayers:2, maxPlayers:4, botOptions:[1,2,3], defaultBots:2, turnLimit:90, botDelay:700, css:CSS,
  newGame:KH.newGame, apply:KH.apply, tick:KH.tick, whoActs:KH.whoActs, botAction:KH.botAction, timeoutAction:KH.timeoutAction,
  render:KHUI.render, tickView:KHUI.tickView,
  rules:`<p><b>Mục tiêu:</b> đạt <b>${KH_WIN} điểm</b> trước. Nhà = 1 điểm, thành phố = 2 điểm, Đường dài nhất (từ 5 đoạn) = 2 điểm, Đạo quân mạnh nhất (từ 3 hiệp sĩ) = 2 điểm, thẻ Điểm thưởng = 1 điểm.</p>
  <p><b>Xếp nhà đầu:</b> mỗi người đặt 1 nhà và 1 đường, sau đó đi ngược lại đặt thêm 1 lượt. Nhà thứ hai nhận ngay tài nguyên của các ô xung quanh. Hai nhà không được đặt sát nhau.</p>
  <p><b>Mỗi lượt:</b> đổ 2 xúc xắc — ô đất mang số đó cho tài nguyên tới các nhà cạnh nó (thành phố nhận 2). Sau đó bạn xây dựng, mua thẻ, đổi hàng rồi bấm Kết thúc lượt.</p>
  <p><b>Ra 7:</b> ai giữ hơn 7 lá tự mất một nửa; người đổ dời kẻ cướp sang ô khác (ô đó ngừng sản xuất) và lấy 1 lá của người có nhà cạnh ô.</p>
  <p><b>Chi phí:</b> Đường = Gỗ + Gạch · Nhà = Gỗ + Gạch + Cừu + Lúa · Thành phố = 2 Lúa + 3 Đá · Thẻ phát triển = Cừu + Lúa + Đá.</p>
  <p><b>Đổi hàng:</b> 4 lá cùng loại lấy 1 lá bất kỳ; có nhà ở cảng 3:1 hoặc cảng 2:1 thì đổi rẻ hơn.</p>
  <p><b>Thẻ phát triển:</b> Hiệp sĩ (dời kẻ cướp), Làm đường (2 đường miễn phí), Được mùa (nhận 2 lá), Độc quyền (gom hết 1 loại tài nguyên của mọi người), Điểm thưởng. Mỗi lượt dùng tối đa 1 thẻ, không dùng thẻ vừa mua.</p>` });
</script>
</body>
</html>
