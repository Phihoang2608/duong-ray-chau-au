<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luật chơi · Đảo Khai Hoang</title>
<style>
@font-face{font-family:"KhFont";font-weight:800;src:url(assets/fonts/baloo-2-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"KhFont";font-weight:800;src:url(assets/fonts/baloo-2-vietnamese-800-normal.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
html,body{margin:0}body{min-height:100vh;color:#fbeed0;font-family:"Times New Roman",serif;background:radial-gradient(ellipse at 40% 20%,#6b4524 0%,#4a2d15 55%,#2c1a0b 100%)}
.wrap{max-width:780px;margin:0 auto;padding:14px 10px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top a{color:#3a210c;text-decoration:none;font-weight:bold;background:linear-gradient(180deg,#fbe3a0,#e0a645 55%,#c98b2c);border:2px solid #5a330f;border-radius:12px;padding:8px 16px}
.panel{border:4px solid #2e1809;border-radius:22px;background:repeating-linear-gradient(180deg,transparent 0 78px,rgba(30,14,2,.45) 78px 80px,rgba(255,215,150,.14) 80px 81px),linear-gradient(165deg,#a8753c 0%,#7d4f24 38%,#946032 62%,#6a4019 100%);box-shadow:inset 0 0 0 3px #cf9f5f,0 16px 50px rgba(0,0,0,.6);padding-bottom:10px}
.khr{padding:16px 18px 6px;font-size:15px;text-shadow:0 1px 0 rgba(30,12,0,.7)}
.krh{text-align:center;font:800 26px/1.1 "KhFont","Baloo 2",sans-serif;color:#ffd76a;-webkit-text-stroke:5px #3a210c;paint-order:stroke fill;margin:2px 0 12px;letter-spacing:.5px}
.krs{background:rgba(45,22,6,.38);border:2px solid rgba(40,18,4,.7);border-radius:14px;padding:30px 14px 10px;margin:20px 0 6px;position:relative;box-shadow:inset 0 0 0 1px rgba(255,215,150,.18)}
.krs h3{position:absolute;left:50%;top:-16px;transform:translateX(-50%);margin:0;white-space:nowrap}
.krs h3 span{display:block;padding:5px 26px 7px;font:800 17px/1 "KhFont","Baloo 2",sans-serif;color:#fff;-webkit-text-stroke:4px #3a210c;paint-order:stroke fill;background:linear-gradient(180deg,#c98f50,#8a5a2c);border:3px solid #2e1809;border-radius:10px;box-shadow:inset 0 0 0 2px #e0b070,0 3px 0 rgba(0,0,0,.5)}
.krs p{margin:6px 0;color:#fbeed0}.krs b{color:#ffe08a}.krs small{color:#e8d3a6;font-size:12.5px}
.kri{width:34px;height:34px;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}.kri.vc{width:30px;height:30px}
.krn{margin:0 4px 0 1px;font:800 17px "KhFont","Baloo 2",sans-serif;color:#fff;-webkit-text-stroke:3.5px #3a210c;paint-order:stroke fill}
.krg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.kri3{flex:1 1 130px;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:8px 6px;border-radius:12px;background:linear-gradient(180deg,#f9e9c2,#e3c98d);border:2px solid #4a2b10;color:#3a210c;text-shadow:none}
.kri3 b{font:800 22px/1 "KhFont","Baloo 2",sans-serif;color:#fff;-webkit-text-stroke:4px #3a210c;paint-order:stroke fill}.kri3 span{font-weight:700;font-size:14px;color:#3a210c}.kri3 small{color:#6b4a22;font-weight:600}
.kri3 img{width:46px;height:46px;object-fit:contain}.krg.r5 .kri3{flex-basis:96px}.krg.r5 .kri3 img{width:56px;height:56px}
.krl{margin:6px 0 4px;padding-left:22px}.krl li{margin:5px 0}
.krt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.krt>div{background:linear-gradient(180deg,#f9e9c2,#e3c98d);border:2px solid #4a2b10;border-radius:12px;padding:7px 10px;color:#3a210c;text-shadow:none;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}
.krt>div b{flex:1 1 100%;font-size:16px;color:#3a210c}.krt>div small{flex:1 1 100%;color:#6b4a22;font-weight:600;margin-bottom:4px}.krc{display:inline-flex;align-items:center}.krt .krn{font-size:15px}
.krd{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:6px 0}.krd>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.krd img{width:92px;height:128px;object-fit:cover;border-radius:8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.55))}.krd b{font-size:15px;color:#ffe08a}
@media (max-width:640px){.krt{grid-template-columns:1fr}.khr{padding:12px 10px 4px;font-size:14px}.krh{font-size:22px}.kri3{flex-basis:44%;max-width:none}}
.khr{font-size:17px}.kri3 span{font-size:15px}.krs small{font-size:13.5px}
.kri3 img.kvp{width:78px;height:auto;max-height:112px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.krd .kcd{display:block;width:100px}.krd .kcd svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.55))}
@media (max-width:640px){.krd{grid-template-columns:repeat(2,minmax(0,1fr))}.krd .kcd{width:110px}.krs{padding:28px 8px 8px}.krs h3 span{padding:5px 16px 7px;font-size:15px}.top a{padding:7px 12px;font-size:14px}.wrap{padding:10px 6px 24px}.panel{border-width:3px;border-radius:16px}}
@media (min-width:1000px){.wrap{max-width:900px}.khr{font-size:18px}.krd{grid-template-columns:repeat(5,1fr)}.krd .kcd{width:120px}}
.rcard .rn{font:800 14px "KhFont","Baloo 2","Arial Black",sans-serif;fill:#fff;text-anchor:middle;stroke:#1b0f06;stroke-width:3.2px;paint-order:stroke;stroke-linejoin:round}
.rcard{overflow:visible}</style></head><body><div class="wrap"><div class="top"><a href="index.html">▶ Vào chơi</a><a href="../../">Trang chủ</a></div><div class="panel" id="p"></div></div>
<script src="art.js?v=2026112823h"></script>
<script src="game.js?v=2026112823h"></script>
<script>document.getElementById('p').innerHTML=(()=>{ const I=(r,c)=>`<img class="kri" src="assets/ic-${r}.webp?v=2026112823h" alt="" title="${KH_RES[r]}">`+(c?`<b class="krn">${c}</b>`:''), N=['Gỗ','Gạch','Cừu','Lúa','Đá'], coin=`<img class="kri vc" src="assets/vp-coin.webp?v=2026112823h" alt="">`, V='?v=2026112823h',
  cost=(c)=>c.map((x,r)=>x?`<span class="krc">${Array(x).fill(I(r)).join('')}</span>`:'').join(''),
  sec=(t,b)=>`<section class="krs"><h3><span>${t}</span></h3>${b}</section>`;
  return `<div class="khr"><div class="krh">Luật chơi · Đảo Khai Hoang</div>`
  +sec('Mục tiêu',`<p>Ai đạt <b>${KH_WIN} điểm chiến thắng</b> ${coin} trước là thắng. Ván kết thúc ngay khi bạn đạt đủ điểm trong lượt của mình.</p>
    <div class="krg"><div class="kri3"><img src="assets/house-neutral.webp${V}" alt=""><b>+1</b><span>Nhà</span></div><div class="kri3"><img src="assets/city-neutral.webp${V}" alt=""><b>+2</b><span>Thành phố</span></div><div class="kri3"><img src="assets/award-road.webp${V}" alt=""><b>+2</b><span>Đường dài nhất<br><small>từ 5 đoạn trở lên</small></span></div><div class="kri3"><img src="assets/award-army.webp${V}" alt=""><b>+2</b><span>Quân mạnh nhất<br><small>từ 3 hiệp sĩ</small></span></div><div class="kri3"><img class="kvp" src="assets/dev-vp.webp${V}" alt=""><b>+1</b><span>Thẻ điểm thưởng<br><small>giữ kín đến khi thắng</small></span></div></div>`)
  +sec('Tài nguyên từ đâu ra',`<div class="krg r5">${[0,1,2,3,4].map(r=>`<div class="kri3">${I(r)}<span>${N[r]}<br><small>${['Rừng','Mỏ gạch','Đồng cỏ','Ruộng lúa','Núi đá'][r]}</small></span></div>`).join('')}</div><p>Sa mạc không sinh ra gì và là nơi kẻ cướp đứng lúc đầu. Mỗi ô đất có một con số (chấm bên dưới càng nhiều thì càng hay ra).</p>`)
  +sec('Xếp nhà ban đầu',`<p>Mỗi người đặt <b>1 nhà + 1 đường</b> theo thứ tự, rồi đi <b>ngược lại</b> đặt thêm 1 nhà + 1 đường. Nhà thứ hai nhận ngay tài nguyên từ các ô quanh nó. Hai nhà không được đặt sát nhau (phải cách ít nhất 1 đoạn đường).</p>`)
  +sec('Một lượt chơi',`<ol class="krl"><li><b>Đổ xúc xắc.</b> Ô nào mang đúng số tổng sẽ toả sóng; mỗi nhà kề ô đó nhận 1 tài nguyên, thành phố nhận 2.</li><li><b>Xây dựng, mua thẻ và đổi hàng</b> theo ý bạn, thứ tự tuỳ chọn.</li><li><b>Kết thúc lượt</b> khi xong. Có thể bấm <b>↩ Hoàn tác</b> để lùi nước vừa đi (xây, nâng cấp, đổi cảng) nếu chưa làm việc khác.</li></ol>`)
  +sec('Bảng chi phí',`<div class="krt"><div><b>Đường</b><small>nối từ nhà hoặc đường của bạn</small>${cost(KH_COST.road)}</div><div><b>Nhà</b><small>+1 điểm · nối với đường của bạn</small>${cost(KH_COST.town)}</div><div><b>Thành phố</b><small>+2 điểm · nâng cấp từ nhà</small>${cost(KH_COST.city)}</div><div><b>Thẻ phát triển</b><small>rút 1 thẻ ngẫu nhiên</small>${cost(KH_COST.dev)}</div></div><p>Giới hạn: <b>15 đường · 5 nhà · 4 thành phố</b>. Nâng cấp thành phố thì nhà cũ được trả lại để xây chỗ khác.</p>`)
  +sec('Ra 7 và kẻ cướp',`<p>Đổ ra <b>7</b> thì không ai nhận tài nguyên. Ai đang giữ <b>hơn 7 lá</b> mất đi một nửa. Sau đó người đổ dời <b>kẻ cướp</b> sang ô khác: ô đó ngừng sản xuất, và bạn lấy ngẫu nhiên 1 lá của một người có nhà cạnh ô đó.</p>`)
  +sec('Đổi hàng',`<div class="krg"><div class="kri3"><b>4 : 1</b><span>Với ngân hàng<br><small>4 lá cùng loại lấy 1 lá bất kỳ</small></span></div><div class="kri3"><b>3 : 1</b><span>Cảng chung<br><small>có nhà ở cảng thì đổi 3 lá</small></span></div><div class="kri3">${I(2)}<b>2 : 1</b><span>Cảng riêng<br><small>2 lá đúng loại ghi trên cảng</small></span></div></div><p>Bấm <b>Đổi cảng</b> để đổi với ngân hàng. Bấm <b>Chợ</b> để gửi yêu cầu đổi với người chơi khác: chọn lá đưa, lá nhận rồi gửi; người nhận bấm Đồng ý hoặc Từ chối (lời mời hết hạn sau 30 giây).</p>`)
  +sec('Thẻ phát triển',`<div class="krd">${[['knight','Hiệp sĩ','14 thẻ · dời kẻ cướp, góp vào Quân mạnh nhất'],['road','Làm đường','2 thẻ · xây 2 đường miễn phí'],['plenty','Được mùa','2 thẻ · nhận ngay 2 tài nguyên tuỳ chọn'],['mono','Độc quyền','2 thẻ · gom hết 1 loại tài nguyên của mọi người'],['vp','Điểm thưởng','5 thẻ · +1 điểm, không cần dùng']].map(([k,n,d])=>`<div><span class="kcd">${KHART.devCard(k,true)}</span><b>${n}</b><small>${d}</small></div>`).join('')}</div><p>Mỗi lượt dùng tối đa <b>1 thẻ</b> (trừ Điểm thưởng) và không được dùng thẻ vừa mua trong lượt đó.</p>`)
  +sec('Giải thưởng +2 điểm',`<p><b>Đường dài nhất:</b> chuỗi đường liên tục từ 5 đoạn trở lên; ai dài hơn sẽ cướp giải. <b>Quân mạnh nhất:</b> ai đã dùng từ 3 hiệp sĩ và nhiều hơn người khác.</p>`)
  +sec('Mẹo nhỏ',`<p>Đặt nhà ở nơi có nhiều loại tài nguyên và số có nhiều chấm (6, 8, 5, 9). Chiếm cảng hợp với tài nguyên mình hay có. Giữ không quá 7 lá khi chưa chắc ra 7 để khỏi mất bài.</p>`)
  +`</div>`; })();</script></body></html>
